# =============================================================================
# Configuración del ambiente sandbox
# Este archivo es solo referencia documentada. Los valores de Terraform
# se definen en infra/environments/sandbox/terraform.tfvars
# =============================================================================

project:
  name: connect-demo
  environment: sandbox

aws:
  region: us-east-1

connect:
  instance_alias: connect-demo-sandbox   # Debe ser único globalmente
  inbound_calls_enabled: true
  outbound_calls_enabled: false          # Activar solo si se necesita flujo proactivo
  language: es-US
  queues:
    retail: RetailQueue
    banking: BankingQueue
  agent:
    username: demo-agent
    first_name: Demo
    last_name: Agent

bedrock:
  model_id: anthropic.claude-3-sonnet-20240229-v1:0
  idle_session_ttl_seconds: 600

dynamodb:
  table_name: connect-demo-sandbox-ConnectDemoData
  billing_mode: PAY_PER_REQUEST

observability:
  log_retention_days: 7
  enable_dashboard: true
  alarm_email: ""          # Dejar vacío para no recibir emails

